<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cây từ khóa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F4EE;
    --paper-raised: #FFFFFF;
    --ink: #23271F;
    --ink-soft: #6B6E62;
    --trunk: #33502F;
    --trunk-soft: #7C9A75;
    --rust: #BF6A34;
    --rust-soft: #E7C6AE;
    --status-done: #33502F;
    --status-done-bg: #E3EADF;
    --status-progress: #9A6B15;
    --status-progress-bg: #F3E6C6;
    --status-todo: #82806F;
    --status-todo-bg: #EBE8DD;
    --border: #DEDACB;
    --shadow: rgba(35, 39, 31, 0.08);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B1C16;
      --paper-raised: #23251D;
      --ink: #EDEAE0;
      --ink-soft: #A3A18E;
      --trunk: #8FB388;
      --trunk-soft: #547850;
      --rust: #E0895A;
      --rust-soft: #4A3A2D;
      --status-done: #8FB388;
      --status-done-bg: #2A3527;
      --status-progress: #D9B15C;
      --status-progress-bg: #3A331F;
      --status-todo: #A3A18E;
      --status-todo-bg: #2C2C24;
      --border: #37392C;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1C16;
    --paper-raised: #23251D;
    --ink: #EDEAE0;
    --ink-soft: #A3A18E;
    --trunk: #8FB388;
    --trunk-soft: #547850;
    --rust: #E0895A;
    --rust-soft: #4A3A2D;
    --status-done: #8FB388;
    --status-done-bg: #2A3527;
    --status-progress: #D9B15C;
    --status-progress-bg: #3A331F;
    --status-todo: #A3A18E;
    --status-todo-bg: #2C2C24;
    --border: #37392C;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  body { padding: 32px 24px 80px; }
  .wrap { max-width: 880px; margin: 0 auto; }

  header.page-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }
  .sync-status {
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 24px 0 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .search-field {
    flex: 1 1 220px;
    position: relative;
  }
  .search-field input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--paper-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
  }
  .search-field input:focus { outline: 2px solid var(--trunk-soft); outline-offset: -1px; }
  .search-field::before {
    content: "";
    position: absolute;
    left: 11px; top: 50%;
    width: 13px; height: 13px;
    transform: translateY(-50%);
    border: 1.6px solid var(--ink-soft);
    border-radius: 50%;
    pointer-events: none;
  }
  .search-field::after {
    content: "";
    position: absolute;
    left: 21px; top: 50%;
    width: 6px; height: 1.6px;
    transform: translateY(6px) rotate(45deg);
    transform-origin: left;
    background: var(--ink-soft);
    pointer-events: none;
  }
  .btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--trunk-soft); }
  .btn:focus-visible { outline: 2px solid var(--trunk-soft); outline-offset: 1px; }
  .btn.primary {
    background: var(--trunk);
    border-color: var(--trunk);
    color: #fff;
  }
  .btn.primary:hover { background: var(--rust); border-color: var(--rust); }
  .btn.ghost { background: transparent; }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--ink);
    font-size: 20px;
    margin: 0 0 6px;
  }
  .empty-state p { margin: 0 0 18px; font-size: 14px; }

  .pillar {
    background: var(--paper-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px var(--shadow);
    overflow: hidden;
  }
  .pillar-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--paper-raised), var(--paper));
  }
  .pillar-head .toggle {
    background: none; border: none; cursor: pointer;
    color: var(--trunk); font-size: 13px; padding: 2px 4px;
    flex-shrink: 0;
    transform: rotate(90deg);
    transition: transform .15s ease;
  }
  .pillar.collapsed .pillar-head .toggle { transform: rotate(0deg); }
  .pillar-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    border: none;
    background: transparent;
    flex: 1;
    min-width: 0;
    padding: 3px 2px;
    border-radius: 4px;
  }
  .pillar-name:focus { outline: none; background: var(--paper); }
  .pillar-count {
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--rust); background: var(--rust-soft); }

  .pillar-body { padding: 6px 16px 14px; }
  .pillar.collapsed .pillar-body { display: none; }

  .kw-row {
    display: grid;
    grid-template-columns: 20px 1.3fr 1fr 150px 30px;
    gap: 10px;
    align-items: center;
    padding: 7px 0;
    position: relative;
  }
  .kw-row::before {
    content: "";
    position: absolute;
    left: 8px; top: -1px;
    width: 10px; height: 50%;
    border-left: 1.5px solid var(--border);
    border-bottom: 1.5px solid var(--border);
    border-radius: 0 0 0 6px;
  }
  .kw-row::after {
    content: "";
    position: absolute;
    left: 8px; top: 45%;
    bottom: -8px;
    border-left: 1.5px solid var(--border);
  }
  .kw-row:last-of-type::after { display: none; }
  .kw-branch { width: 20px; }
  .kw-row input[type=text] {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
  }
  .kw-row input[type=text]:hover { border-color: var(--border); }
  .kw-row input[type=text]:focus { border-color: var(--trunk-soft); background: var(--paper); outline: none; }
  .kw-row input.kw-text { font-weight: 500; }
  .kw-row input.kw-article::placeholder,
  .kw-row input.kw-text::placeholder { color: var(--ink-soft); opacity: .6; }

  select.kw-status {
    width: 100%;
    padding: 6px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    appearance: none;
    text-align: center;
    background-position: right 8px center;
  }
  select.kw-status:focus { outline: 2px solid var(--trunk-soft); }
  select.status-todo { background-color: var(--status-todo-bg); color: var(--status-todo); }
  select.status-progress { background-color: var(--status-progress-bg); color: var(--status-progress); }
  select.status-done { background-color: var(--status-done-bg); color: var(--status-done); }

  .add-kw {
    margin-left: 20px;
    margin-top: 4px;
    background: none;
    border: none;
    color: var(--trunk);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 4px;
  }
  .add-kw:hover { color: var(--rust); }

  .add-pillar-row { text-align: center; margin-top: 12px; }

  .hidden-row { display: none !important; }

  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  @media (max-width: 620px) {
    .kw-row { grid-template-columns: 14px 1fr; grid-template-areas: "b text" "b article" "b status"; row-gap: 6px; padding: 10px 0; }
    .kw-branch { grid-area: b; }
    .kw-text { grid-area: text; }
    .kw-article { grid-area: article; }
    .kw-status-wrap { grid-area: status; display: flex; justify-content: space-between; align-items: center; }
    select.kw-status { width: auto; min-width: 130px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <h1>Cây từ khóa</h1>
      <p class="tagline">Quản lý cụm chủ đề và từ khóa con cho nội dung mới</p>
    </div>
    <div class="sync-status" id="syncStatus">Đang tải…</div>
  </header>

  <div class="toolbar">
    <div class="search-field">
      <input type="text" id="searchInput" placeholder="Tìm từ khóa hoặc bài viết…">
    </div>
    <button class="btn" id="exportCsvBtn">Xuất CSV</button>
    <button class="btn" id="exportJsonBtn">Xuất JSON</button>
    <button class="btn primary" id="addPillarBtn">+ Cụm chủ đề</button>
  </div>

  <main id="pillarList"></main>

  <footer>Dữ liệu được lưu tự động cho riêng bạn trong công cụ này.</footer>
</div>

<script>
(function () {
  "use strict";

  const STATUSES = [
    { value: "todo", label: "Chưa viết", cls: "status-todo" },
    { value: "progress", label: "Đang viết", cls: "status-progress" },
    { value: "done", label: "Đã đăng", cls: "status-done" },
  ];
  const STATUS_MAP = Object.fromEntries(STATUSES.map(s => [s.value, s]));

  const STORAGE_KEY = "cay-tu-khoa:v1";
  let state = { pillars: [] };
  let saveTimer = null;
  let searchTerm = "";

  const listEl = document.getElementById("pillarList");
  const syncEl = document.getElementById("syncStatus");
  const searchInput = document.getElementById("searchInput");

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function setSync(text) {
    syncEl.textContent = text;
  }

  function scheduleSave() {
    setSync("Đang lưu…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 500);
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSync("Đã lưu trong trình duyệt này");
    } catch (e) {
      setSync("Lỗi khi lưu — trình duyệt có thể đang chặn bộ nhớ");
    }
  }

  function addPillar() {
    state.pillars.push({ id: uid(), name: "Cụm chủ đề mới", collapsed: false, keywords: [] });
    render();
    scheduleSave();
    const inputs = listEl.querySelectorAll(".pillar-name");
    if (inputs.length) inputs[inputs.length - 1].select();
  }

  function removePillar(pid) {
    const p = state.pillars.find(p => p.id === pid);
    if (!p) return;
    if (p.keywords.length && !confirm('Xóa cụm "' + p.name + '" và toàn bộ ' + p.keywords.length + ' từ khóa bên trong?')) return;
    state.pillars = state.pillars.filter(p => p.id !== pid);
    render();
    scheduleSave();
  }

  function addKeyword(pid) {
    const p = state.pillars.find(p => p.id === pid);
    if (!p) return;
    p.keywords.push({ id: uid(), text: "", article: "", status: "todo" });
    render();
    scheduleSave();
    const rows = listEl.querySelectorAll('.pillar[data-id="' + pid + '"] .kw-text');
    if (rows.length) rows[rows.length - 1].focus();
  }

  function removeKeyword(pid, kid) {
    const p = state.pillars.find(p => p.id === pid);
    if (!p) return;
    p.keywords = p.keywords.filter(k => k.id !== kid);
    render();
    scheduleSave();
  }

  function matchesSearch(pillar, kw) {
    if (!searchTerm) return true;
    const hay = (pillar.name + " " + kw.text + " " + kw.article).toLowerCase();
    return hay.includes(searchTerm);
  }

  function render() {
    listEl.innerHTML = "";

    if (state.pillars.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<h2>Chưa có cụm từ khóa nào</h2><p>Bắt đầu bằng cách tạo một cụm chủ đề, ví dụ "Vay tiền mặt F88" hoặc "Hũ Sinh Lời".</p>';
      const btn = document.createElement("button");
      btn.className = "btn primary";
      btn.textContent = "+ Tạo cụm đầu tiên";
      btn.addEventListener("click", addPillar);
      empty.appendChild(btn);
      listEl.appendChild(empty);
      return;
    }

    state.pillars.forEach(pillar => {
      const visibleKws = pillar.keywords.filter(k => matchesSearch(pillar, k));
      const pillarMatchesName = searchTerm && pillar.name.toLowerCase().includes(searchTerm);
      if (searchTerm && visibleKws.length === 0 && !pillarMatchesName) return;

      const card = document.createElement("section");
      card.className = "pillar" + (pillar.collapsed ? " collapsed" : "");
      card.dataset.id = pillar.id;

      const head = document.createElement("div");
      head.className = "pillar-head";

      const toggle = document.createElement("button");
      toggle.className = "toggle";
      toggle.type = "button";
      toggle.setAttribute("aria-label", "Thu gọn / mở rộng cụm");
      toggle.textContent = "▸";
      toggle.addEventListener("click", () => {
        pillar.collapsed = !pillar.collapsed;
        render();
        scheduleSave();
      });

      const nameInput = document.createElement("input");
      nameInput.className = "pillar-name";
      nameInput.value = pillar.name;
      nameInput.addEventListener("change", () => {
        pillar.name = nameInput.value.trim() || "Cụm chủ đề";
        scheduleSave();
      });

      const count = document.createElement("span");
      count.className = "pillar-count";
      count.textContent = pillar.keywords.length + " từ khóa";

      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.type = "button";
      delBtn.title = "Xóa cụm";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => removePillar(pillar.id));

      head.append(toggle, nameInput, count, delBtn);
      card.appendChild(head);

      const body = document.createElement("div");
      body.className = "pillar-body";

      const kwsToRender = searchTerm ? visibleKws : pillar.keywords;
      kwsToRender.forEach(kw => {
        const row = document.createElement("div");
        row.className = "kw-row";

        const branch = document.createElement("span");
        branch.className = "kw-branch";

        const textInput = document.createElement("input");
        textInput.type = "text";
        textInput.className = "kw-text";
        textInput.placeholder = "từ khóa…";
        textInput.value = kw.text;
        textInput.addEventListener("change", () => { kw.text = textInput.value; scheduleSave(); });

        const articleInput = document.createElement("input");
        articleInput.type = "text";
        articleInput.className = "kw-article";
        articleInput.placeholder = "bài viết liên kết (URL hoặc tên)";
        articleInput.value = kw.article;
        articleInput.addEventListener("change", () => { kw.article = articleInput.value; scheduleSave(); });

        const statusWrap = document.createElement("div");
        statusWrap.className = "kw-status-wrap";

        const statusSelect = document.createElement("select");
        statusSelect.className = "kw-status " + STATUS_MAP[kw.status].cls;
        STATUSES.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.value;
          opt.textContent = s.label;
          if (s.value === kw.status) opt.selected = true;
          statusSelect.appendChild(opt);
        });
        statusSelect.addEventListener("change", () => {
          kw.status = statusSelect.value;
          statusSelect.className = "kw-status " + STATUS_MAP[kw.status].cls;
          scheduleSave();
        });

        const delKwBtn = document.createElement("button");
        delKwBtn.className = "icon-btn";
        delKwBtn.type = "button";
        delKwBtn.title = "Xóa từ khóa";
        delKwBtn.textContent = "✕";
        delKwBtn.addEventListener("click", () => removeKeyword(pillar.id, kw.id));

        statusWrap.appendChild(statusSelect);
        row.append(branch, textInput, articleInput, statusWrap, delKwBtn);
        body.appendChild(row);
      });

      const addKwBtn = document.createElement("button");
      addKwBtn.className = "add-kw";
      addKwBtn.type = "button";
      addKwBtn.textContent = "+ Thêm từ khóa";
      addKwBtn.addEventListener("click", () => addKeyword(pillar.id));
      body.appendChild(addKwBtn);

      card.appendChild(body);
      listEl.appendChild(card);
    });

    if (state.pillars.length > 0) {
      const addRow = document.createElement("div");
      addRow.className = "add-pillar-row";
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "+ Cụm chủ đề mới";
      btn.addEventListener("click", addPillar);
      addRow.appendChild(btn);
      listEl.appendChild(addRow);
    }
  }

  function csvEscape(v) {
    const s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportCsv() {
    const rows = [["Cụm chủ đề", "Từ khóa", "Bài viết liên kết", "Trạng thái"]];
    state.pillars.forEach(p => {
      p.keywords.forEach(k => {
        rows.push([p.name, k.text, k.article, STATUS_MAP[k.status].label]);
      });
    });
    const csv = "\uFEFF" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
    downloadFile("cay-tu-khoa.csv", csv, "text/csv;charset=utf-8");
  }

  function exportJson() {
    const json = JSON.stringify(state, null, 2);
    downloadFile("cay-tu-khoa.json", json, "application/json;charset=utf-8");
  }

  document.getElementById("addPillarBtn").addEventListener("click", addPillar);
  document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
  document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
  searchInput.addEventListener("input", () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    render();
  });

  (function init() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.pillars)) state = data;
      }
      setSync("Đã lưu trong trình duyệt này");
    } catch (e) {
      setSync("Không tải được dữ liệu đã lưu");
    }
    render();
  })();
})();
</script>
</body>
</html>
